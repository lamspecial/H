<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>QR Code دائري - Shabih.io</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qr-code-styling/1.6.0-rc.1/qr-code-styling.js"></script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    gap: 20px;
  }
  #canvas-wrap {
    background: white;
    padding: 24px;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  }
  h2 { color: #222; margin: 0; }
  #download {
    padding: 10px 24px;
    border-radius: 999px;
    border: none;
    background: #111;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  #download:hover { background: #333; }
</style>
</head>
<body>
  <h2>Shabih.io</h2>
  <div id="canvas-wrap"></div>
  <button id="download">تحميل PNG</button>

<script>
  const qrCode = new QRCodeStyling({
    width: 400,
    height: 400,
    type: "canvas",
    data: "https://Shabih.io",
    margin: 10,
    qrOptions: {
      errorCorrectionLevel: "H"
    },
    dotsOptions: {
      type: "dots",
      color: "#1a1a1a",
      gradient: {
        type: "radial",
        rotation: 0,
        colorStops: [
          { offset: 0, color: "#3a3a3a" },
          { offset: 1, color: "#000000" }
        ]
      }
    },
    backgroundOptions: {
      color: "#ffffff",
    },
    cornersSquareOptions: {
      type: "extra-rounded",
      color: "#000000"
    },
    cornersDotOptions: {
      type: "dot",
      color: "#000000"
    },
    imageOptions: {
      crossOrigin: "anonymous",
      imageSize: 0.35,
      margin: 6
    }
  });

  qrCode.append(document.getElementById("canvas-wrap"));

  document.getElementById("download").addEventListener("click", () => {
    qrCode.download({ name: "shabih-qr", extension: "png" });
  });
</script>
</body>
</html>
